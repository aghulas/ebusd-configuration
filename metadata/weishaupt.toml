# --- vendor codes ----------------------------------------------------------------------------
# The number a vendor manual prints for a value (parameter 535, P112, P31, i35), with the
# numbering scheme it belongs to: the same number names other settings on other devices, so a
# code is meaningful only with its scheme. Written as the manual's parameter table prints it,
# without a space; `pattern` is that spelling, checked, not published. A code sits on the
# message, or on the field of a message that carries several numbered values, never both. One
# code may sit on several messages. Source of every code: evidence record vendor-codes.
# [[vendor_open]]: messages a manual menu covers whose code is not established yet
# (circuit-pair: two numbers, one per heating circuit; display: a candidate number only the
# display can confirm; mismatch: the number the manual prints there means another setting;
# manual: not read yet); no code on them.

[vendor_schemes.wcm-ka-3]
label = { en = "WCM-KA 3.0 system manager", fr = "Manager de cascade WCM-KA 3.0" }
document = "83258404"
pattern = "[0-9]{3}"

