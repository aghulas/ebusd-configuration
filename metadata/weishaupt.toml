# --- Code lists (fault codes, from 1.6.0) ------------------------------------------------------
# The fault codes a field carries: raw value -> the codes the manual prints for it and a label.
# Two disjoint number spaces: the boiler's W / F 11-89 and the WCM devices' 130-202, so a code of
# a fault log is looked up in both and lands in one at most. 0 (end of a fault, none pending) is
# in neither. The labels are proposed to the owner (status); evidence/vendor-codes.md, lot 3.

