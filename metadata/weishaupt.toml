# --- field sets of the messages with several fields ------------------------------------------
# A key is a field name, or a regular expression on the whole field name. `skip`: no label,
# the field is not shown (bits without a known meaning). `guard`: the reading is valid only
# when this field reads 0.

[fields.memory.firstbyte]
label = { en = "First answer byte", fr = "Premier octet de la réponse" }
kind = "diagnostic"
guard = true

[fields.eventcounters]
include = "memory"
burnerhourstoday = { label = { en = "Burner hours today (by the symbol)", fr = "Heures brûleur du jour (selon le symbole)" } }
ignitionstoday = { label = { en = "Ignitions today (by the symbol)", fr = "Allumages du jour (selon le symbole)" } }
poweroncount = { label = { en = "Mains switch-ons", fr = "Mises sous tension" } }
"ukn\\d" = { skip = true }
resetcount = { label = { en = "Resets", fr = "Réinitialisations" } }
shutoffcount = { label = { en = "Shut-offs", fr = "Coupures" } }

[fields.counters]
include = "memory"
operatinghours = { label = { en = "Operating hours", fr = "Heures de fonctionnement" } }
burnerhours = { label = { en = "Burner operating hours", fr = "Heures de fonctionnement du brûleur" } }
burnerstarts = { label = { en = "Burner starts", fr = "Démarrages brûleur" } }

# absent: the value a temperature reads when its sensor is not fitted. Boilers -40 (seen on the
# outside, hot-water and separator registers and in RAM, evidence bc-info-values, bc-live-values);
# system manager and heating modules -100.0 (seen on the outside temperature of the modules and on
# calorifier registers of the system manager, evidence ka-reads, em-hcmode).
[fields.temperatures]
include = "memory"
