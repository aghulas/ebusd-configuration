# --- field sets of the messages with several fields ------------------------------------------
# A key is a field name, or a regular expression on the whole field name. `skip`: no label,
# the field is not shown (bits without a known meaning). `guard`: the reading is valid only
# when this field reads 0.

[fields.memory.firstbyte]
label = { en = "First answer byte", fr = "Premier octet de la réponse" }
kind = "diagnostic"
guard = true

[fields.counters]
include = "memory"
operatinghours = { label = { en = "Operating hours", fr = "Heures de fonctionnement" } }
burnerhours = { label = { en = "Burner operating hours", fr = "Heures de fonctionnement du brûleur" } }
burnerstarts = { label = { en = "Burner starts", fr = "Démarrages brûleur" } }

[fields.temperatures]
include = "memory"
returntemp = { label = { en = "Return temperature", fr = "Température retour" } }
fluegastemp = { label = { en = "Flue gas temperature", fr = "Température des fumées" } }
supplytemp = { label = { en = "Flow temperature", fr = "Température de départ" } }
outsidetemp = { label = { en = "Outside temperature", fr = "Température extérieure" } }

[fields.operation]
include = "memory"
load = { label = { en = "Burner load", fr = "Puissance du brûleur" } }
ionisation = { label = { en = "Ionisation signal", fr = "Signal d'ionisation" } }
pumpspeed = { label = { en = "Pump speed", fr = "Vitesse du circulateur" } }

[fields.faultcounters]
